<!DOCTYPE html>

<head>

  <style>
    :root {
      --mint: #7fd8c4;
      --ink: #2b3a42;
      --bg: #f7fbfa;
      --card: #ffffff;
      --muted: #6b7c85;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);

      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(43, 58, 66, 0.08);

    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .en { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.12em; margin-bottom: 24px; }
    .divider { width: 48px; height: 3px; background: var(--mint); margin: 0 auto 24px; border-radius: 2px; }
    p.desc { font-size: 0.95rem; margin-bottom: 28px; text-align: left; }
    ul.links { list-style: none; text-align: left; margin-bottom: 28px; }
    ul.links li { margin-bottom: 10px; }
    ul.links a { color: #1a7f6b; text-decoration: none; font-size: 0.95rem; }
    ul.links a:hover { text-decoration: underline; }
    .contact { font-size: 0.85rem; color: var(--muted); border-top: 1px solid #e5eeec; padding-top: 20px; }
    .contact a { color: var(--muted); }

  <main class="card">
